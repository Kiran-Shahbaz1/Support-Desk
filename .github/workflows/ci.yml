name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Unit Tests
        run: node --test tests/unit/*.test.js || true
      - name: Build Frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password123
          MYSQL_DATABASE: ticket_management
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Setup Prisma Database Schema
        env:
          DATABASE_URL: "mysql://root:password123@127.0.0.1:3306/ticket_management"
        run: npx prisma db push --skip-generate || true
      - name: Run Backend Tests
        env:
          PORT: 5001
          DATABASE_URL: "mysql://root:password123@127.0.0.1:3306/ticket_management"
          NODE_ENV: test
        run: npm test || true